[package]
name = "schedai-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui         = "0.28"
crossterm       = "0.28"
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
reqwest         = { version = "0.13", features = ["blocking", "json"] }
chrono          = { version = "0.4", features = ["serde"] }
